<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masar · مسار</title>
<meta name="description" content="Masar finds the businesses in the Gulf and the Middle East that are ready to buy.">
<meta name="theme-color" content="#0b1314">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one dark Masar world in the brand ink. Pinned intro (logo docks into the bar > desktop > phone),
   then a pinned vector map that zooms out from Amman to Jordan to the GCC & Middle East. Arabic first. */
:root {
  --bg: #0b1314;         /* sea and sky: deepest ink */
  --ink: #101a1b;        /* brand ink: logo tile, app sidebar */
  --land: #142322;       /* map land */
  --border: #2a4643;     /* map borders */
  --teal: #176b64;       /* brand teal */
  --teal-hi: #2f897c;
  --mint: #72b7a7;       /* brand dot */
  --paper: #faf8f3;      /* logo stroke, app work area */
  --sand: #e5e2d9;
  --stone: #777b75;
  --fg: #eef2f0;
  --muted: #9aaeac;
  --line: rgba(154, 174, 172, 0.18);
  --panel: #121e1f;
  --font-en: "Manrope", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font: var(--font-ar);
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html[lang="en"] { --font: var(--font-en); }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.65; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 6px; }

/* ---------- Top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.nav { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-left: var(--gl); padding-right: var(--gr); background: linear-gradient(to bottom, rgba(11, 19, 20, 0.92), rgba(11, 19, 20, 0)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; direction: ltr; }
.brand svg { display: block; }
.brand .word { display: flex; flex-direction: column; line-height: 1; }
.brand .word b { font: 800 19px/1 var(--font-en); letter-spacing: -0.03em; }
.brand .word small { font: 500 11px/1 var(--font-ar); color: var(--muted); margin-top: 4px; }
.nav-links { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
.nav-links a { text-decoration: none; }
.nav-links a:hover { color: var(--fg); }
.nav-end { display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px; border-radius: 6px; font-weight: 600; font-size: 14px; line-height: 1; text-decoration: none; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn.mint { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.btn.lang { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn svg { width: 18px; height: 18px; flex: none; }
@media (max-width: 960px) { .nav-links, .nav-end .hide-sm { display: none; } }
@media (max-width: 400px) { .nav-end .hide-xs { display: none; } }

/* ---------- Intro (pinned) ---------- */
.intro { position: relative; height: 300vh; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
.sky { position: absolute; inset: 0; background: radial-gradient(48% 42% at 50% 46%, rgba(23, 107, 100, 0.28), transparent 70%), linear-gradient(180deg, var(--bg), #0e1a1b); }
.sky svg { position: absolute; inset: -5%; width: 110%; height: 110%; }
.sky path { fill: none; stroke: var(--teal-hi); stroke-width: 1; opacity: 0.22; vector-effect: non-scaling-stroke; }
.logo-hero { position: absolute; left: 50%; top: 42%; width: min(34vmin, 230px); aspect-ratio: 1; transform-origin: 50% 50%; translate: -50% -50%; will-change: transform; }
.logo-hero svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 24px 60px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 40px rgba(114, 183, 167, 0.18)); }
.lockup { position: absolute; left: 0; right: 0; top: calc(42% + min(34vmin, 230px) / 2 + 26px); text-align: center; }
.lockup .ar-name { display: block; font: 700 clamp(34px, 5vw, 52px)/1.1 var(--font-ar); }
.lockup .en-name { display: block; font: 800 16px/1.2 var(--font-en); letter-spacing: 0.02em; color: var(--muted); margin-top: 6px; }
.lockup .tag { display: block; margin-top: 14px; color: var(--muted); font-size: 15px; padding-left: var(--gl); padding-right: var(--gr); }
.scroll-hint { position: absolute; left: 50%; bottom: 4vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.scroll-hint i { width: 1px; height: 34px; background: linear-gradient(var(--mint), transparent); animation: drip 1.8s ease-in-out infinite; }
@keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

.hero-copy { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 80px); text-align: center; padding-left: var(--gl); padding-right: var(--gr); }
.hero-copy h1 { margin: 0 auto; max-width: 16ch; font-size: clamp(30px, 5.2vw, 64px); line-height: 1.18; font-weight: 700; text-wrap: balance; }
html[lang="en"] .hero-copy h1 { line-height: 1.04; letter-spacing: -0.035em; }
.hero-copy h1 em { font-style: normal; color: var(--mint); }
.hero-copy p { margin: 12px auto 0; max-width: 46ch; color: var(--muted); font-size: clamp(15px, 1.5vw, 18px); }
.hero-copy .actions { margin-top: 18px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }

.device-row { position: absolute; inset: 0; pointer-events: none; }
/* Desktop app: built at 1100x640, scaled to fit */
.desk { position: absolute; left: 50%; top: 0; width: 1100px; height: 640px; margin-left: -550px; border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 210px 1fr; background: var(--paper); color: var(--ink); box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08); transform-origin: top center; }
.side { background: var(--ink); color: #dfe7e5; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.side .s-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font: 800 17px/1 var(--font-en); letter-spacing: -0.03em; direction: ltr; }
.side span.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #b7c6c4; }
.side span.item.on { background: rgba(114, 183, 167, 0.14); color: #fff; }
.side .credits { margin-top: auto; padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #b7c6c4; }
.side .credits b { display: block; font: 700 22px/1.3 var(--font-en); color: #fff; }
.work { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.brief { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.brief h3 { margin: 0; margin-inline-end: 12px; font-size: 20px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: #fff; border: 1px solid var(--sand); color: #3a4846; }
.chip.t { background: #dcece7; border-color: #dcece7; color: #12564f; }
.table { background: #fff; border: 1px solid var(--sand); border-radius: 10px; overflow: hidden; font-size: 13px; }
.tr { display: grid; grid-template-columns: 2.3fr 1fr 1.3fr 0.6fr 1fr; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid #efece5; transition: background 0.25s; }
.tr.head { border-top: 0; background: #f6f4ee; color: var(--stone); font-size: 11.5px; font-weight: 600; }
.tr .nm b { display: block; font-size: 13.5px; }
.tr .nm span { color: var(--stone); font-size: 12px; }
.bar { height: 6px; border-radius: 6px; background: #ece9e1; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--teal); }
.score { font: 700 13px/1 var(--font-en); font-variant-numeric: tabular-nums; }
.st { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; justify-self: start; }
.st.new { background: #f0ece2; color: #5b5f59; }
.st.meet { background: #dcece7; color: #12564f; }
.st.won { background: var(--teal); color: #fff; }
.tr.hot { background: #eef7f4; }
.cursor { position: fixed; left: 0; top: 0; width: 22px; height: 22px; z-index: 4; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4)); pointer-events: none; }
/* Phone */
.phone { position: absolute; left: 50%; top: 0; width: 290px; height: 600px; margin-left: -145px; border-radius: 42px; padding: 10px; background: #050b0c; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12) inset; transform-origin: top center; }
.screen { width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; font-size: 12px; }
.p-top { background: var(--ink); color: #fff; padding: 34px 16px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.p-top b { font: 800 16px/1 var(--font-en); letter-spacing: -0.03em; }
.p-top span { font-size: 11px; color: #b7c6c4; }
.p-list { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.p-card { background: #fff; border: 1px solid var(--sand); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.p-card b { font-size: 13px; }
.p-card small { color: var(--stone); }
.ring { grid-row: 1 / span 2; grid-column: 2; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--font-en); background: conic-gradient(var(--teal) var(--p), #ece9e1 0); position: relative; }
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
.ring span { position: relative; z-index: 1; }
.p-act { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 6px; }
.p-act span { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-weight: 600; font-size: 11px; background: #f0ece2; }
.p-act span.go { background: var(--teal); color: #fff; }
.p-tabs { display: flex; justify-content: space-around; padding: 10px 0 18px; border-top: 1px solid var(--sand); background: #fff; color: var(--stone); font-size: 10.5px; }
.p-tabs span.on { color: var(--teal); font-weight: 700; }
/* Captions float on top of the app cards, on a frosted ink panel */
.caption { position: absolute; z-index: 5; left: 0; right: 0; bottom: 7vh; width: fit-content; max-width: min(440px, calc(100% - 32px)); margin: 0 auto; padding: 14px 18px; border-radius: 14px; background: rgba(11, 19, 20, 0.78); border: 1px solid rgba(250, 248, 243, 0.1); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 14px; color: #c9d6d4; text-align: center; }
.caption b { display: block; color: var(--fg); font-size: 14px; font-weight: 700; margin-bottom: 4px; }
@media (max-width: 760px) { .caption { bottom: 4vh; font-size: 13px; padding: 12px 14px; } }

/* ---------- Map (pinned) ---------- */
.mapsec { position: relative; height: 270vh; }
.mapsec .stage { background: var(--bg); }
#mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#mapsvg .c { fill: var(--land); stroke: var(--border); stroke-width: 0.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill 0.8s; }
#mapsvg[data-stage="1"] .c.jo, #mapsvg[data-stage="2"] .c.jo { fill: #1d3a37; }
#mapsvg[data-stage="2"] .c.gcc { fill: #193432; }
#mapsvg .lake { fill: var(--bg); }
#mapsvg .grat { fill: none; stroke: rgba(154, 174, 172, 0.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
#mapsvg .road { fill: none; stroke: var(--teal-hi); stroke-opacity: 0.55; stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#mapsvg .road.minor { stroke-opacity: 0.3; stroke-width: 0.9; }
#mapsvg .route { fill: none; stroke: var(--mint); stroke-linecap: round; }
#mapsvg .route-glow { fill: none; stroke: var(--mint); stroke-opacity: 0.2; stroke-linecap: round; }
#mapsvg .dot { fill: var(--mint); }
#mapsvg .dot.home { fill: var(--paper); }
#mapsvg .ping { fill: none; stroke: var(--mint); }
#mapsvg text { font-family: var(--font); fill: #dbe6e3; paint-order: stroke; stroke: rgba(11, 19, 20, 0.9); stroke-linejoin: round; }
#mapsvg text.big { fill: var(--mint); font-weight: 700; }
#mapsvg text.home { fill: #fff; font-weight: 700; }
.shade { position: absolute; inset: 0; pointer-events: none; }
html[dir="rtl"] .shade { background: linear-gradient(270deg, rgba(11, 19, 20, 0.94) 0%, rgba(11, 19, 20, 0.6) 34%, rgba(11, 19, 20, 0) 56%), linear-gradient(180deg, rgba(11, 19, 20, 0.7), transparent 16%, transparent 84%, rgba(11, 19, 20, 0.85)); }
html[dir="ltr"] .shade { background: linear-gradient(90deg, rgba(11, 19, 20, 0.94) 0%, rgba(11, 19, 20, 0.6) 34%, rgba(11, 19, 20, 0) 56%), linear-gradient(180deg, rgba(11, 19, 20, 0.7), transparent 16%, transparent 84%, rgba(11, 19, 20, 0.85)); }
.steps { position: absolute; inset-inline-start: var(--gl); top: 50%; width: min(440px, calc(100vw - 32px)); }
.step { position: absolute; left: 0; right: 0; top: 0; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--mint); }
html[lang="en"] .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.step h2 { margin: 8px 0 12px; font-size: clamp(28px, 4vw, 50px); line-height: 1.2; font-weight: 700; text-wrap: balance; }
html[lang="en"] .step h2 { line-height: 1.05; letter-spacing: -0.03em; }
.step p { margin: 0; color: #c9d6d4; font-size: 17px; max-width: 40ch; }
.stats { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 18px; }
.stats div { font-size: 12.5px; color: var(--muted); }
.stats b { display: block; font: 700 28px/1.2 var(--font-en); color: var(--fg); font-variant-numeric: tabular-nums; }
.progress { position: absolute; inset-inline-end: var(--gr); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.progress i { width: 3px; height: 26px; border-radius: 3px; background: var(--line); transition: background 0.3s; }
.progress i.on { background: var(--mint); }
@media (max-width: 760px) {
  html[dir] .shade { background: linear-gradient(180deg, rgba(11, 19, 20, 0.5), rgba(11, 19, 20, 0) 14%, rgba(11, 19, 20, 0) 44%, rgba(11, 19, 20, 0.95) 64%); }
  .steps { top: auto; bottom: 5vh; }
  .step { top: auto; bottom: 0; }
  .step p { font-size: 15px; }
  .stats b { font-size: 22px; }
  .progress { display: none; }
}

/* ---------- Download ---------- */
.get { padding-block: 110px 40px; padding-left: var(--gl); padding-right: var(--gr); background: var(--bg); }
.get-in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.get-head { grid-column: 1 / -1; text-align: center; margin-bottom: 20px; }
.get-head h2 { margin: 0; font-size: clamp(28px, 4vw, 46px); line-height: 1.2; text-wrap: balance; }
.get-head p { margin: 10px auto 0; color: var(--muted); max-width: 46ch; }
.get-card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); text-align: start; cursor: pointer; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
.get-card:hover { border-color: var(--mint); transform: translateY(-2px); }
.get-card .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(114, 183, 167, 0.12); color: var(--mint); }
.get-card .ico svg { width: 24px; height: 24px; }
.get-card h3 { margin: 0; font-size: 22px; }
.get-card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.get-card .os { display: flex; gap: 8px; flex-wrap: wrap; }
.get-card .os span { font: 600 12px/1 var(--font-en); padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.get-card.cli { grid-column: 1 / -1; text-decoration: none; color: inherit; background: linear-gradient(135deg, rgba(23, 107, 100, 0.28), rgba(18, 30, 31, 0.9) 60%); border-color: rgba(114, 183, 167, 0.35); }
.get-card.cli .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.get-card.cli code { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mint); direction: ltr; }
.get-card .go { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 8px; background: var(--mint); color: var(--ink); font-weight: 700; font-size: 14.5px; }
.get-card.soon { cursor: default; opacity: 0.72; }
.get-card.soon:hover { border-color: var(--line); transform: none; }
.get-card .badge-soon { position: absolute; top: 18px; inset-inline-end: 18px; padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: rgba(216, 166, 87, 0.14); color: #d8a657; }
@media (max-width: 760px) { .get-in { grid-template-columns: 1fr; } }

/* Download sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgba(5, 10, 11, 0.7); backdrop-filter: blur(6px); display: grid; place-items: center; padding-left: var(--gl); padding-right: var(--gr); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 24px; transform: translateY(14px); transition: transform 0.3s cubic-bezier(0.65, 0, 0.35, 1); }
.sheet-bg.open .sheet { transform: none; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.sheet h3 { margin: 0; font-size: 22px; }
.x { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
.sheet > p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); }
.opt.mine { border-color: var(--mint); }
.opt .oi { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); }
.opt .oi svg { width: 22px; height: 22px; }
.opt .ot { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.opt .ot b { font-size: 15.5px; }
.opt .ot small { color: var(--muted); font-size: 12.5px; }
.opt .tagmine { font-size: 11px; color: var(--mint); font-weight: 700; }
.howto { margin: 10px 0 0; padding: 14px 16px; border-radius: 12px; background: rgba(114, 183, 167, 0.08); color: #cfe0dc; font-size: 14px; }
.howto ol { margin: 6px 0 0; padding-inline-start: 20px; }
.soon { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); color: var(--muted); font-size: 13.5px; }

/* ---------- Close + footer ---------- */
.close { position: relative; padding-block: 90px 40px; padding-left: var(--gl); padding-right: var(--gr); background: linear-gradient(180deg, var(--bg), #0e1a1b); }
.close-in { max-width: 1100px; margin: 0 auto; }
.cta { text-align: center; }
.cta h2 { margin: 0 auto; max-width: 18ch; font-size: clamp(28px, 4.6vw, 56px); line-height: 1.2; font-weight: 700; text-wrap: balance; }
html[lang="en"] .cta h2 { line-height: 1.05; letter-spacing: -0.035em; }
.cta p { color: var(--muted); max-width: 46ch; margin: 14px auto 24px; }
.contact { margin-top: 80px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; padding: 28px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); }
.contact h3 { margin: 0 0 6px; font-size: 24px; }
.contact p { margin: 0; color: var(--muted); }
.ways { display: grid; gap: 10px; align-content: start; }
.way { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); min-width: 0; }
.way span { display: flex; flex-direction: column; min-width: 0; }

    const W = innerWidth, H = innerHeight;
    if (W < 760) return { x: 0, y: 70, w: W, h: H * 0.46 };
    const panel = Math.min(520, W * 0.42);
    return lang === "ar" ? { x: 0, y: 60, w: W - panel, h: H - 100 } : { x: panel, y: 60, w: W - panel, h: H - 100 };
  }
  function fitBox(lon0, lat0, lon1, lat1) {
    const a = P(lon0, lat1), b = P(lon1, lat0), A = avail();
    return { cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2, s: Math.min(A.w / (b[0] - a[0]), A.h / (b[1] - a[1])) };
  }
  const STAGES = () => [fitBox(35.62, 31.68, 36.3, 32.2), fitBox(34.8, 29.2, 39.4, 33.5), fitBox(33.5, 20.5, 59.5, 33.3)];
  const easeIO = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  // z in [0, 2]: one camera move between stages (log scale, centre follows the zoom)
  function setZoom(z) {
    const st = STAGES(), i = Math.min(1, Math.floor(z)), f = easeIO(Math.min(1, Math.max(0, z - i)));
    const A = st[i], B = st[i + 1], s = Math.exp(Math.log(A.s) + (Math.log(B.s) - Math.log(A.s)) * f);
    const g = Math.abs(1 / B.s - 1 / A.s) < 1e-9 ? f : (1 / s - 1 / A.s) / (1 / B.s - 1 / A.s);
    view = { cx: A.cx + (B.cx - A.cx) * g, cy: A.cy + (B.cy - A.cy) * g, s };
    drawMap();
  }

  /* ================= Scroll story ================= */
  const fitDesk = () => Math.min((innerWidth - 32) / 1100, (innerHeight * 0.56) / 640, 1);
  root.style.setProperty("--fit", fitDesk().toFixed(3));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = !reduce && gsap && window.ScrollTrigger;
  if (motion) { root.classList.add("motion"); gsap.registerPlugin(ScrollTrigger); }

  applyLang();
  let zoomNow = motion ? 0 : 2;
  fetch("/app/map.json").then((r) => r.json()).then((d) => { buildMap(d); setZoom(zoomNow); }).catch(() => {});

  $("#langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("masar-lang", lang); } catch (e) {}
    applyLang();
    if (motion) { const y = scrollY; build(); scrollTo(0, y); } else setZoom(2);
  });

  if (!motion) {
    addEventListener("resize", () => { root.style.setProperty("--fit", fitDesk().toFixed(3)); if (mapReady) setZoom(2); });
    return;
  }

  // The logo draws itself once on load
  const stroke = $("#logoHero .stroke"), SL = stroke.getTotalLength();
  gsap.set(stroke, { strokeDasharray: SL, strokeDashoffset: SL });
  gsap.set("#logoHero .dot", { scale: 0, transformOrigin: "50% 50%" });
  gsap.set("#logoHero svg", { scale: 0.72, autoAlpha: 0, transformOrigin: "50% 50%" });
  gsap.set("#lockup", { autoAlpha: 0, y: 14 });
  gsap.timeline({ delay: 0.15 })
    .to("#logoHero svg", { scale: 1, autoAlpha: 1, duration: 0.8, ease: "power3.out" })
    .to(stroke, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, "-=0.3")
    .to("#logoHero .dot", { scale: 1, duration: 0.55, ease: "back.out(2.6)" }, "-=0.2")
    .to("#lockup", { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, "-=0.25");

  let tlIntro, tlMap;
  function build() {
    [tlIntro, tlMap].forEach((t) => { if (t) { if (t.scrollTrigger) t.scrollTrigger.kill(); t.progress(0).kill(); } });
    const W = innerWidth, H = innerHeight, mobile = W < 760, rtl = lang === "ar", dir = rtl ? -1 : 1, s = fitDesk();
    root.style.setProperty("--fit", s.toFixed(3));

    /* --- Intro --- */
    gsap.set("#logoHero", { clearProps: "transform,opacity,visibility" });
    gsap.set(["#navMark", "#navWord"], { autoAlpha: 0 });
    // Land the big logo exactly on the bar's logo
    const big = $("#logoHero").getBoundingClientRect(), nav = $("#navMark").getBoundingClientRect();
    const dock = { x: nav.left + nav.width / 2 - (big.left + big.width / 2), y: nav.top + nav.height / 2 - (big.top + big.height / 2), scale: nav.width / big.width };
    gsap.set("#heroCopy", { autoAlpha: 0, y: 30, scale: 1, filter: "blur(0px)" });
    gsap.set("#desk", { scale: s, y: H + 40, x: 0, top: mobile ? H * 0.47 : H * 0.36 });
    const phoneScale = mobile ? Math.min(0.8, (H * 0.6) / 600) : Math.min(1, (H * 0.64) / 600);
    gsap.set("#phone", { top: mobile ? H * 0.3 : H * 0.29, x: mobile ? 0 : -dir * Math.min(420, W * 0.27), y: H, rotate: dir * 5, scale: phoneScale });
    gsap.set("#cursor", { autoAlpha: 0 });
    gsap.set(["#capDesk", "#capPhone"], { autoAlpha: 0, y: 12 });
    $$("#desk .tr.hot").forEach((r) => r.classList.remove("hot"));
    const scoreCell = () => $('#desk [data-row="0"] .score').getBoundingClientRect();

    tlIntro = gsap.timeline({ defaults: { ease: "none" }, scrollTrigger: { trigger: ".intro", start: "top top", end: "bottom bottom", scrub: 0.35, invalidateOnRefresh: true } });
    tlIntro
      .fromTo("#hint", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, immediateRender: false }, 0)
      .fromTo("#lockup", { autoAlpha: 1, y: 0 }, { autoAlpha: 0, y: -10, duration: 0.6, immediateRender: false }, 0)
      .to("#logoHero", { x: dock.x, y: dock.y, scale: dock.scale, duration: 1.6, ease: "power3.inOut" }, 0.1)
      .set("#navMark", { autoAlpha: 1 }, 1.7)
      .set("#logoHero", { autoAlpha: 0 }, 1.7)
      .to("#navWord", { autoAlpha: 1, duration: 0.4 }, 1.6)
      .to("#heroCopy", { autoAlpha: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.5)
      .to("#desk", { y: 0, duration: 1.6, ease: "power3.out" }, 2.4)
      .to("#heroCopy", { autoAlpha: 0.07, scale: 1.04, filter: "blur(2px)", duration: 1.4, ease: "power2.inOut" }, 2.5)
      .set("#heroCopy", { pointerEvents: "none" }, 2.6)
      .to("#capDesk", { autoAlpha: 1, y: 0, duration: 0.5 }, 3.4)
      .fromTo("#cursor", { autoAlpha: 0, x: W * (rtl ? 0.3 : 0.7), y: H * 0.98 },
        { autoAlpha: 1, duration: 1, x: () => scoreCell().left + scoreCell().width / 2, y: () => scoreCell().top + scoreCell().height / 2 }, 4.1)
      .call(() => { const r = $('#desk [data-row="0"]'); if (r) r.classList.toggle("hot", tlIntro.scrollTrigger.direction > 0); }, null, 5.1)
      .to("#cursor", { autoAlpha: 0, duration: 0.3 }, 5.6)
      .to("#capDesk", { autoAlpha: 0, duration: 0.4 }, 5.6)
      .to("#desk", mobile ? { autoAlpha: 0.15, scale: s * 0.94, duration: 1.2 } : { x: dir * W * 0.11, scale: s * 0.86, duration: 1.2, ease: "power2.inOut" }, 5.6)
      .to("#phone", { y: mobile ? -H * 0.02 : -H * 0.05, rotate: 0, duration: 1.5, ease: "power3.out" }, 5.8)
      .to("#capPhone", { autoAlpha: 1, y: 0, duration: 0.5 }, 6.8)
      .to({}, { duration: 0.3 });

    /* --- Map --- */
    const steps = $$(".step"), bars = $$(".progress i");
    gsap.set(steps, { autoAlpha: 0, y: 24, yPercent: mobile ? 0 : -50 });
    const z = { v: 0 }, rd = { v: 0 };
    routeDraw = 0; zoomNow = 0; setZoom(0);
    tlMap = gsap.timeline({ defaults: { ease: "none" }, scrollTrigger: {
      trigger: ".mapsec", start: "top top", end: "bottom bottom", scrub: 0.35,
      onUpdate: (st) => { const i = st.progress < 0.36 ? 0 : st.progress < 0.68 ? 1 : 2; bars.forEach((b, k) => b.classList.toggle("on", k === i)); svg.dataset.stage = i; }
    } });
    tlMap
      .to(steps[0], { autoAlpha: 1, y: 0, duration: 0.5 }, 0.2)
      .to(steps[0], { autoAlpha: 0, y: -24, duration: 0.4 }, 2.1)
      .to(z, { v: 1, duration: 1.6, onUpdate: () => { zoomNow = z.v; setZoom(z.v); } }, 2.2)
      .to(steps[1], { autoAlpha: 1, y: 0, duration: 0.5 }, 3.4)
      .to(steps[1], { autoAlpha: 0, y: -24, duration: 0.4 }, 5)
      .to(z, { v: 2, duration: 1.7, onUpdate: () => { zoomNow = z.v; setZoom(z.v); } }, 5.1)
      .to(steps[2], { autoAlpha: 1, y: 0, duration: 0.5 }, 6.4)
      .to(rd, { v: 1, duration: 1.3, onUpdate: () => { routeDraw = rd.v; drawMap(); } }, 6.5)
      .to({}, { duration: 0.3 });
    ScrollTrigger.refresh();
  }
  build();

  /* Clicking the logo glides back to the top, so the logo flies back to the middle */
  let backRaf = 0;
  $$('a.brand[href="#top"]').forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    cancelAnimationFrame(backRaf);
    const from = scrollY;
    if (!from) return;
    if (!motion) { scrollTo(0, 0); return; }
    const dur = Math.min(1400, 500 + from / 12), t0 = performance.now();
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const tick = (now) => { const t = Math.min(1, (now - t0) / dur); scrollTo(0, from * (1 - ease(t))); if (t < 1) backRaf = requestAnimationFrame(tick); };
    backRaf = requestAnimationFrame(tick);
  }));
  ["wheel", "touchstart"].forEach((ev) => addEventListener(ev, () => cancelAnimationFrame(backRaf), { passive: true }));

  // Pulse on Amman
  gsap.to({ t: 0 }, { t: 1, duration: 2.2, repeat: -1, ease: "power1.out", onUpdate: function () {
    const t = this.targets()[0].t, u = 1 / view.s;
    pings.forEach((p) => { p.setAttribute("r", ((5 + t * 22) * u).toFixed(3)); p.style.opacity = (1 - t).toFixed(2); });
  } });

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const y = scrollY; build(); scrollTo(0, y); setZoom(zoomNow); }, 200); });
})();
</script>
</body>
</html>
