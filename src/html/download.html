<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download Masar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<style>
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(60% 50% at 50% 0%, rgba(23, 107, 100, 0.22), transparent 70%), var(--bg); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px; padding-left: var(--gl); padding-right: var(--gr); }
.wrap { flex: 1; width: min(980px, 100%); margin: 0 auto; padding-block: 18px 48px; padding-left: var(--gl); padding-right: var(--gr); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 4px; } }

/* Left: the story text */
.status { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; color: var(--mint); font-size: 14px; }
.ring { width: 22px; height: 22px; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bgc { stroke: rgba(114, 183, 167, 0.18); }
.ring .fg { stroke: var(--mint); stroke-linecap: round; stroke-dasharray: 57; stroke-dashoffset: 57; transform: rotate(-90deg); transform-origin: center; animation: fill 2.4s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
.ring .ok { stroke: var(--ink); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; }
.done .ring .bgc { fill: var(--mint); stroke: var(--mint); transition: fill 0.3s; }
.done .ring .ok { animation: draw 0.35s 0.1s forwards; }
@keyframes fill { to { stroke-dashoffset: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
h1 { margin: 14px 0 10px; font-size: clamp(30px, 4.6vw, 46px); line-height: 1.2; text-wrap: balance; }
html[lang="en"] h1 { line-height: 1.08; letter-spacing: -0.03em; }
.lead { margin: 0 0 22px; color: var(--muted); font-size: 16.5px; max-width: 46ch; }
.file { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 22px; }
.file .fi { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); flex: none; }
.file .fi svg { width: 20px; height: 20px; }
.file .ft { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.file .ft b { font: 600 14px/1.3 var(--font-en); direction: ltr; text-align: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .ft small { color: var(--muted); font-size: 12.5px; }
.bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; width: 0; background: var(--mint); border-radius: 4px; animation: grow 2.4s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
@keyframes grow { to { width: 100%; } }

.steps { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 4px; counter-reset: s; }
.steps li { display: flex; gap: 14px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; color: #cfe0dc; transition: background 0.3s, color 0.3s; cursor: pointer; }
.steps li::before { counter-increment: s; content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-en); border: 1px solid var(--line); color: var(--muted); transition: background 0.3s, color 0.3s, border-color 0.3s; }
.steps li.on { background: rgba(114, 183, 167, 0.08); color: #fff; }
.steps li.on::before { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.steps li span { padding-top: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.again { background: none; border: 0; padding: 8px 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.again:hover { color: var(--fg); }
.mock-note { margin-top: 18px; font-size: 12.5px; color: var(--muted); opacity: 0.8; }

/* Right: the animated scene */
.scene { direction: ltr; position: relative; aspect-ratio: 5 / 4; border-radius: 18px; background: linear-gradient(180deg, #142223, #0f191a); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene text { font-family: var(--font-en); }
.stores { display: grid; gap: 10px; margin-bottom: 22px; }
.store { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 700; border: 0; cursor: pointer; text-align: start; width: 100%; }
.store svg { width: 24px; height: 24px; flex: none; }
.store small { display: block; font-weight: 500; font-size: 12px; opacity: 0.7; }

/* Where the browser puts the file: always the physical top right in desktop browsers */
.dl-hint { position: fixed; top: 70px; right: 18px; z-index: 50; display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 13.5px; font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); opacity: 0; transform: translateY(-8px); transition: opacity 0.4s, transform 0.4s; pointer-events: none; }
.dl-hint.show { opacity: 1; transform: none; }
.dl-hint svg { width: 18px; height: 18px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translate(3px, -3px); } }
@media (max-width: 860px), (pointer: coarse) { .dl-hint { display: none; } }
@media (prefers-reduced-motion: reduce) { .ring .fg, .bar i { animation-duration: 0.01s; } .dl-hint svg { animation: none; } .scene * { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Masar"><span id="mk"></span><span class="word"><b>masar</b><small>مسار</small></span></a>
  <button class="btn sm" type="button" data-lang-toggle data-t="langBtn"></button>
</header>

<div class="dl-hint" id="hint" aria-hidden="true"><span data-t="hint"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></div>

<main class="wrap">
  <section>
    <div class="status" id="status">
      <svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle class="bgc" cx="11" cy="11" r="9"/><circle class="fg" cx="11" cy="11" r="9"/><path class="ok" d="M7 11.3l2.7 2.6L15 8.6"/></svg>
      <span id="statusTxt"></span>
    </div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div id="fileBox"></div>
    <ol class="steps" id="steps"></ol>
    <div class="row">
      <a class="btn mint" id="cta" href="/dashboard"></a>
      <button class="again" type="button" id="again"></button>
    </div>
    <p class="mock-note" data-t="mock"></p>
  </section>
  <section class="scene" id="scene" aria-hidden="true"></section>
</main>

<script src="app.js"></script>
<script>
(function () {
  "use strict";
  const { $, $$ } = Masar;
  const qs = new URLSearchParams(location.search);
  const ua = navigator.userAgent;
  const guess = /iPhone|iPad|iPod/.test(ua) ? "iph" : /Android/.test(ua) ? "and" : /Win/.test(ua) ? "win" : /Linux/.test(ua) ? "lin" : "mac";
  let os = qs.get("os") || (location.hash.match(/os=(\w+)/) || [])[1] || guess;
  if (!["mac", "win", "lin", "iph", "and"].includes(os)) os = guess;
  const fromTour = qs.get("from") === "tour" || /from=tour/.test(location.hash);
  const mobile = os === "iph" || os === "and";

  const FILES = { mac: ["Masar-1.0.0.dmg", "112 MB"], win: ["Masar-Setup-1.0.0.exe", "96 MB"], lin: ["masar_1.0.0_amd64.deb", "104 MB"] };
  const D = {
    ar: {
      langBtn: "English", hint: "ملفك هنا", mock: "نسخة تجريبية: الملف الحقيقي ينضاف أول ما يجهز التطبيق.",
      started: "بدأ التحميل", done: "اكتمل التحميل",
      title: { mac: "مسار في طريقه لجهازك الماك", win: "مسار في طريقه لجهازك", lin: "مسار في طريقه لجهازك", iph: "حمّل مسار على الآيفون", and: "حمّل مسار على الأندرويد" },
      lead: "خطوتين وتكون جاهز. الملف ينحفظ في مجلد التنزيلات.",
      leadM: "التطبيق مجاني، وتسجّل دخولك بنفس حسابك.",
      steps: {
        mac: ["افتح ملف Masar.dmg من التنزيلات", "اسحب أيقونة مسار إلى مجلد التطبيقات", "افتح مسار وسجّل دخولك"],
        win: ["افتح ملف Masar-Setup.exe من التنزيلات", "اضغط «تثبيت» وانتظر ثواني", "مسار يفتح لحاله، سجّل دخولك"],
        lin: ["افتح ملف masar.deb من التنزيلات", "اضغط «تثبيت» في مركز البرامج", "شغّل مسار من قائمة التطبيقات وسجّل دخولك"],
        iph: ["اضغط الزر تحت وافتح App Store", "اضغط «احصل عليه»", "افتح مسار وسجّل دخولك"],
        and: ["اضغط الزر تحت وافتح Google Play", "اضغط «تثبيت»", "افتح مسار وسجّل دخولك"]
      },
      appStore: ["حمّله من", "App Store"], play: ["احصل عليه من", "Google Play"],
      again: "ما بدأ التحميل؟ جرّب مرة ثانية", againM: "تبي نسخة الكمبيوتر؟",
      ctaTour: "كمّل للوحة التحكم", cta: "سجّل دخولك", toast: "بدأ التحميل من جديد", mb: "ميجا"
    },
    en: {
      langBtn: "العربية", hint: "Your file is here", mock: "Preview: the real file is added as soon as the app is ready.",
      started: "Download started", done: "Download complete",
      title: { mac: "Masar is on its way to your Mac", win: "Masar is on its way to your PC", lin: "Masar is on its way to your computer", iph: "Get Masar on iPhone", and: "Get Masar on Android" },
      lead: "Two more steps and you're set. The file is saved in your Downloads folder.",
      leadM: "The app is free. Sign in with the same account.",
      steps: {
        mac: ["Open Masar.dmg from your Downloads", "Drag the Masar icon into Applications", "Open Masar and sign in"],
        win: ["Open Masar-Setup.exe from your Downloads", "Click Install and wait a few seconds", "Masar opens by itself. Sign in"],
        lin: ["Open masar.deb from your Downloads", "Click Install in Software Center", "Launch Masar from your apps and sign in"],
        iph: ["Tap the button below to open the App Store", "Tap Get", "Open Masar and sign in"],
        and: ["Tap the button below to open Google Play", "Tap Install", "Open Masar and sign in"]
      },
      appStore: ["Download on the", "App Store"], play: ["Get it on", "Google Play"],
      again: "Didn't start? Try again", againM: "Want the computer app?",
      ctaTour: "Continue to dashboard", cta: "Sign in", toast: "Download started again", mb: "MB"
    }
  };

  /* Scenes: one small looping illustration per system, drawn in a 500x400 box */
  const TILE = (x, y, s) => '<g transform="translate(' + x + " " + y + ") scale(" + s / 96 + ')"><rect width="96" height="96" rx="20" fill="#101A1B"/><rect x=".75" y=".75" width="94.5" height="94.5" rx="19.25" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/><path d="M25 67V34c0-5 4-9 9-9h10c5 0 9 4 9 9v12c0 5 4 9 9 9h9" fill="none" stroke="#FAF8F3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="55" r="7" fill="#72B7A7"/></g>';
  const WIN = (title) => '<rect x="50" y="60" width="400" height="280" rx="14" fill="#1a2a2b" stroke="rgba(255,255,255,.08)"/><path d="M50 74a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v22H50z" fill="#203233"/>' + title;
  const SCENES = {
    mac: () => WIN('<circle cx="72" cy="78" r="5" fill="#e07a6b"/><circle cx="88" cy="78" r="5" fill="#d8a657"/><circle cx="104" cy="78" r="5" fill="#72b7a7"/><text x="250" y="82" text-anchor="middle" font-size="12" fill="#9aaeac">Masar</text>') +
      '<g class="drag">' + TILE(110, 160, 92) + '<text x="156" y="278" text-anchor="middle" font-size="13" fill="#eef2f0">Masar</text></g>' +
      '<path d="M222 206h56" stroke="#72b7a7" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M272 198l10 8-10 8" fill="none" stroke="#72b7a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<g transform="translate(300 160)"><path d="M0 14a8 8 0 0 1 8-8h26l10 10h40a8 8 0 0 1 8 8v58a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#2f897c"/><path d="M0 30h92v52a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#3aa092"/><path d="M34 46l12 22 12-22M38 60h16" stroke="#e8f4f1" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="346" y="278" text-anchor="middle" font-size="13" fill="#eef2f0">Applications</text>' +
      '<style>.drag{animation:drag 4s cubic-bezier(.65,0,.35,1) infinite}@keyframes drag{0%,35%{transform:none;opacity:1}70%{transform:translate(190px,0) scale(.8);opacity:1}80%{transform:translate(190px,0) scale(.6);opacity:0}92%{transform:none;opacity:0}100%{transform:none;opacity:1}}.drag{transform-box:fill-box;transform-origin:center}</style>',
    win: () => WIN('<text x="70" y="82" font-size="12" fill="#9aaeac">Masar Setup</text><path d="M418 74h12M408 74h0" stroke="#9aaeac" stroke-width="1.5"/><path d="M418 70l8 8M426 70l-8 8" stroke="#9aaeac" stroke-width="1.5" stroke-linecap="round"/>') +
      TILE(206, 128, 88) + '<text x="250" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f0">Installing Masar…</text>' +
      '<rect x="120" y="272" width="260" height="8" rx="4" fill="rgba(255,255,255,.08)"/><rect class="pb" x="120" y="272" width="260" height="8" rx="4" fill="#72b7a7"/>' +
      '<style>.pb{transform-box:fill-box;transform-origin:left;animation:pb 3s cubic-bezier(.65,0,.35,1) infinite}@keyframes pb{0%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}</style>',
    lin: () => WIN('<text x="70" y="82" font-size="12" fill="#9aaeac">Software</text>') +
      TILE(84, 124, 84) + '<text x="190" y="152" font-size="20" font-weight="700" fill="#eef2f0">Masar</text><text x="190" y="174" font-size="12.5" fill="#9aaeac">Lead finder for the Gulf</text>' +
      '<rect class="ib" x="190" y="188" width="110" height="34" rx="8" fill="#72b7a7"/><text class="ibt" x="245" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#101a1b">Install</text>' +
      '<g fill="rgba(255,255,255,.06)"><rect x="84" y="250" width="160" height="66" rx="8"/><rect x="256" y="250" width="160" height="66" rx="8"/></g>' +
      '<style>.ib{transform-box:fill-box;transform-origin:center;animation:press 2.6s ease-in-out infinite}@keyframes press{0%,40%,60%,100%{transform:none}50%{transform:scale(.94)}}</style>',
    phone: (store) => '<rect x="170" y="30" width="160" height="330" rx="26" fill="#101a1b" stroke="rgba(255,255,255,.14)" stroke-width="2"/><rect x="226" y="42" width="48" height="10" rx="5" fill="#000"/>' +
      TILE(206, 92, 88) + '<text x="250" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f0">Masar</text><text x="250" y="230" text-anchor="middle" font-size="11" fill="#9aaeac">' + store + '</text>' +
      '<rect class="ib" x="210" y="248" width="80" height="30" rx="15" fill="#72b7a7"/><text x="250" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#101a1b">GET</text>' +
      '<style>.ib{transform-box:fill-box;transform-origin:center;animation:press 2.6s ease-in-out infinite}@keyframes press{0%,40%,60%,100%{transform:none}50%{transform:scale(.92)}}</style>'
  };
  const FILE_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15l3 3 3-3"/></svg>';
  const APPLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9C6.1 7 4.5 8 3.6 9.6c-1.8 3.2-.5 7.9 1.3 10.4.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.8-4.6zM13.9 5.3c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.8v18.4c0 .5.5.8.9.6L20.6 13c.5-.3.5-.9 0-1.2L4.9 2.2c-.4-.2-.9.1-.9.6z"/></svg>';

  let doneTimer;
  function startDownload() {
    // On the real site this points at the release file, e.g. location.href = "/releases/" + FILES[os][0]
    const st = $("#status");
    st.classList.remove("done");
    $$("#status .fg, #fileBox .bar i").forEach((el) => { el.style.animation = "none"; void el.getBoundingClientRect(); el.style.animation = ""; });
    $("#statusTxt").textContent = Masar.t("started");
    clearTimeout(doneTimer);
    doneTimer = setTimeout(() => { st.classList.add("done"); $("#statusTxt").textContent = Masar.t("done"); }, 2500);
    $("#hint").classList.add("show");
    setTimeout(() => $("#hint").classList.remove("show"), 6000);
  }

  function render() {
    const d = D[Masar.lang];
    document.title = Masar.lang === "ar" ? "تحميل مسار" : "Download Masar";
    $("#title").textContent = d.title[os];
    $("#lead").textContent = mobile ? d.leadM : d.lead;
    $("#statusTxt").textContent = $("#status").classList.contains("done") ? d.done : d.started;
    $("#status").hidden = mobile;
    $("#fileBox").innerHTML = mobile
      ? '<div class="stores"><button class="store" type="button" id="storeBtn">' + (os === "iph" ? APPLE : PLAY) + "<span><small>" + (os === "iph" ? d.appStore[0] : d.play[0]) + "</small>" + (os === "iph" ? d.appStore[1] : d.play[1]) + "</span></button></div>"
      : '<div class="card file"><span class="fi">' + FILE_IC + '</span><span class="ft"><b>' + FILES[os][0] + "</b><small><span class=\"num\">" + FILES[os][1].split(" ")[0] + "</span> " + d.mb + '</small><span class="bar"><i></i></span></span></div>';
    $("#steps").innerHTML = d.steps[os].map((s, i) => '<li data-i="' + i + '"' + (i === 0 ? ' class="on"' : "") + "><span>" + s + "</span></li>").join("");
    $$("#steps li").forEach((li) => li.addEventListener("click", () => { $$("#steps li").forEach((x) => x.classList.toggle("on", x === li)); }));
    $("#cta").textContent = fromTour ? d.ctaTour : d.cta;
    $("#again").textContent = mobile ? d.againM : d.again;
    $("#scene").innerHTML = '<svg viewBox="0 0 500 400">' + (mobile ? SCENES.phone(os === "iph" ? "App Store" : "Google Play") : SCENES[os]()) + "</svg>";
    const sb = $("#storeBtn");
    if (sb) sb.addEventListener("click", () => Masar.toast(Masar.lang === "ar" ? "رابط المتجر ينضاف أول ما ينزل التطبيق" : "The store link is added once the app is live"));
  }

  // Walk through the steps slowly so the eye follows the order
  let stepI = 0;
  setInterval(() => { const li = $$("#steps li"); if (!li.length || document.hidden) return; stepI = (stepI + 1) % li.length; li.forEach((x, i) => x.classList.toggle("on", i === stepI)); }, 2600);

  $("#mk").innerHTML = Masar.mark(34);
  $("#again").addEventListener("click", () => {
    if (mobile) { location.href = "/#download"; return; }
    startDownload(); Masar.toast(Masar.t("toast"));
  });
  Masar.onLang(render);
  Masar.init(D);
  if (!mobile) startDownload();
})();
</script>
</body>
</html>
