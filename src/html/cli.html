<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masar CLI</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<style>
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(60% 50% at 50% 0%, rgba(23, 107, 100, 0.22), transparent 70%), var(--bg); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px; padding-left: var(--gl); padding-right: var(--gr); }
.wrap { flex: 1; width: min(980px, 100%); margin: 0 auto; padding-block: 24px 56px; padding-left: var(--gl); padding-right: var(--gr); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px; align-items: center; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 8px; } }
h1 { margin: 10px 0 12px; font-size: clamp(32px, 4.8vw, 50px); line-height: 1.15; }
html[lang="en"] h1 { letter-spacing: -0.03em; line-height: 1.05; }
.lead { margin: 0 0 22px; color: var(--muted); font-size: 16.5px; max-width: 46ch; }
.who { display: grid; gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; }
.who li { display: flex; gap: 10px; align-items: flex-start; color: #cfe0dc; }
.who li::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 9px; border-radius: 50%; background: var(--mint); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn.soon { background: rgba(216, 166, 87, 0.14); color: #d8a657; border-color: rgba(216, 166, 87, 0.3); cursor: not-allowed; min-height: 44px; padding: 0 20px; }
.note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
/* Install steps: each command is shown left-to-right with a copy button */
.steps { display: grid; gap: 14px; margin: 0 0 22px; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; gap: 7px; }
.steps li > span { display: flex; gap: 9px; align-items: baseline; color: #cfe0dc; font-weight: 600; }
.steps li > span::before { content: counter(s); flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(114, 183, 167, 0.16); color: var(--mint); font-size: 12.5px; }
.steps a { color: var(--mint); }
.cmd { direction: ltr; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 6px 6px 14px; border-radius: 10px; background: #0a1112; border: 1px solid var(--line); }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e7f1ee; scrollbar-width: none; }
.cmd code::-webkit-scrollbar { display: none; }
.cmd button { flex: none; min-height: 34px; padding: 0 12px; font-size: 13px; }
.unavailable .steps { display: none; }
.soon-row { display: none; }
.unavailable .soon-row { display: flex; }
.note a { color: var(--mint); }
/* A terminal window drawn in HTML: always left-to-right */
.term { direction: ltr; border-radius: 16px; background: #0a1112; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); overflow: hidden; font: 13.5px/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.term .bar { display: flex; gap: 7px; padding: 12px 14px; background: #142223; }
.term .bar i { width: 11px; height: 11px; border-radius: 50%; background: #e07a6b; }
.term .bar i:nth-child(2) { background: #d8a657; } .term .bar i:nth-child(3) { background: #72b7a7; }
.term pre { margin: 0; padding: 18px 20px 22px; color: #cfe0dc; white-space: pre-wrap; min-height: 260px; }
.term .p { color: var(--mint); } .term .m { color: #6f8987; } .term .h { color: #fff; font-weight: 700; }
.term .cur { display: inline-block; width: 8px; height: 15px; background: var(--mint); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.apps { width: min(980px, 100%); margin: 0 auto 56px; padding-left: var(--gl); padding-right: var(--gr); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.apps .card { padding: 18px; display: flex; gap: 14px; align-items: center; }
.apps .card b { display: block; }
.apps .card small { color: var(--muted); }
.apps .tag { margin-inline-start: auto; flex: none; padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: rgba(216, 166, 87, 0.14); color: #d8a657; }
@media (max-width: 640px) { .apps { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .term .cur { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Masar" id="brand"></a>
  <button class="btn sm" type="button" data-lang-toggle data-t="langBtn"></button>
</header>

<main class="wrap">
  <section>
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <ul class="who"><li data-t="w1"></li><li data-t="w2"></li><li data-t="w3"></li></ul>
    <ol class="steps" id="steps">
      <li><span><span><span data-t="s1"></span> <a href="https://nodejs.org/en/download" target="_blank" rel="noopener" data-t="s1Link"></a></span></span></li>
      <li><span data-t="s2"></span><div class="cmd"><code id="cmdInstall"></code><button class="btn sm" type="button" data-copy="cmdInstall" data-t="copy"></button></div></li>
      <li><span data-t="s3"></span><div class="cmd"><code id="cmdLogin">masar login</code><button class="btn sm" type="button" data-copy="cmdLogin" data-t="copy"></button></div></li>
      <li><span data-t="s4"></span><div class="cmd"><code id="cmdFind">masar find</code><button class="btn sm" type="button" data-copy="cmdFind" data-t="copy"></button></div></li>
    </ol>
    <div class="row soon-row">
      <button class="btn soon" type="button" aria-disabled="true" data-t="soonBtn"></button>
    </div>
    <div class="row">
      <a class="btn" href="/login?mode=signup" data-t="web"></a>
    </div>
    <p class="note"><span data-t="help"></span> <a href="mailto:masar.leads@gmail.com?subject=Masar%20CLI" dir="ltr">masar.leads@gmail.com</a></p>
  </section>
  <section class="term" aria-hidden="true">
    <div class="bar"><i></i><i></i><i></i></div>
    <pre id="term"></pre>
  </section>
</main>

<section class="apps">
  <div class="card"><span><b data-t="desk"></b><small data-t="deskS"></small></span><span class="tag" data-t="soon"></span></div>
  <div class="card"><span><b data-t="mob"></b><small data-t="mobS"></small></span><span class="tag" data-t="soon"></span></div>
</section>

<script src="app.js"></script>
<script>
(function () {
  "use strict";
  const { $ } = Masar;
  const D = {
    ar: {
      langBtn: "English", eyebrow: "طريقة 1 من 2", title: "مسار CLI", soon: "قريباً", soonBtn: "التحميل قريباً", web: "أو استخدم مسار من المتصفح",
      lead: "أداة سطر الأوامر من مسار، تشتغل بالذكاء الاصطناعي اللي عندك: اشتراك Claude Pro أو Max، أو ChatGPT، أو نموذج على جهازك.",
      w1: "ما تحتاج مفتاح API ولا دفع حسب الاستخدام.", w2: "تشتغل على ويندوز وماك ولينكس.", w3: "العملاء ينحفظون في لوحتك على مسار، مرتبين حسب فرصة الإغلاق.",
      s1: "ثبّت Node.js (نسخة 20.3 أو أحدث).", s1Link: "تحميل Node.js", s2: "افتح الطرفية (Terminal أو PowerShell) وثبّت مسار:", s3: "سجّل دخولك بحساب مسار:", s4: "ابدأ أول بحث:",
      copy: "نسخ", copied: "تم النسخ", help: "واجهتك مشكلة في التثبيت؟ راسلنا:", notify: "تبي نعلمك أول ما تنزل؟ راسلنا:",
      desk: "تطبيق الكمبيوتر", deskS: "طريقة 2 من 2: التطبيق الكامل بكل الإعدادات.", mob: "تطبيق الجوال", mobS: "مسار على الآيفون والأندرويد."
    },
    en: {
      langBtn: "العربية", eyebrow: "Way 1 of 2", title: "Masar CLI", soon: "Coming soon", soonBtn: "Download coming soon", web: "Or use Masar in your browser",
      lead: "Masar's command-line tool. It runs on the AI you already have: Claude Pro or Max, ChatGPT, or a model on your own computer.",
      w1: "No API key and no pay-per-use bills.", w2: "Runs on Windows, macOS and Linux.", w3: "Leads go to your Masar dashboard, ranked by closing chance.",
      s1: "Install Node.js (version 20.3 or newer).", s1Link: "Get Node.js", s2: "Open a terminal (Terminal or PowerShell) and install Masar:", s3: "Sign in with your Masar account:", s4: "Run your first search:",
      copy: "Copy", copied: "Copied", help: "Stuck installing? Email us:", notify: "Want to know when it's out? Email us:",
      desk: "Desktop app", deskS: "Way 2 of 2: the full app with everything set up.", mob: "Phone app", mobS: "Masar on iPhone and Android."
    }
  };
  $("#brand").innerHTML = Masar.mark(32) + '<span class="word"><b>masar</b><small>مسار</small></span>';

  // A short, looping demo of what a session looks like
  const LINES = [
    ['<span class="p">$</span> ', "masar find"],
    ['<span class="m">? </span>', "Who do you sell to?  clinics"],
    ['<span class="m">? </span>', "Which cities?        Amman, Riyadh"],
    ['<span class="m">  </span>', "Searching the map…"],
    ['<span class="m">  </span>', "Checking 64 businesses…"],
    ['<span class="h">  ✓ </span>', "38 leads ranked by closing chance"],
    ['<span class="m">  </span>', "Saved to your Masar dashboard"]
  ];
  let timer;
  function play() {
    clearTimeout(timer);
    const el = $("#term");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.innerHTML = LINES.map((l) => l[0] + l[1]).join("\n"); return; }
    let i = 0, c = 0, out = "";
    const step = () => {
      if (i >= LINES.length) { el.innerHTML = out + '\n<span class="p">$</span> <span class="cur"></span>'; timer = setTimeout(play, 3500); return; }
      const [pre, txt] = LINES[i];
      c++;
      el.innerHTML = out + pre + txt.slice(0, c) + '<span class="cur"></span>';
      if (c >= txt.length) { out += pre + txt + "\n"; i++; c = 0; timer = setTimeout(step, i === 1 ? 500 : 380); }
      else timer = setTimeout(step, i === 0 ? 70 : 18);
    };
    step();
  }
  // The install command points at this site's own copy of the CLI package.
  const pkg = location.origin + "/cli/masar-cli.tgz";
  $("#cmdInstall").textContent = "npm install -g " + pkg;
  // If the package is missing from this deployment, show "coming soon" instead of a broken command.
  fetch(pkg, { method: "HEAD" }).then((r) => { if (!r.ok) document.body.classList.add("unavailable"); }).catch(() => {});
  document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => {
    const text = document.getElementById(b.dataset.copy).textContent.trim();
    const done = () => { b.textContent = D[Masar.lang].copied; setTimeout(() => { b.textContent = D[Masar.lang].copy; }, 1600); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById(b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, select); } catch (e) { select(); }
  }));
  Masar.onLang(() => { document.title = Masar.lang === "ar" ? "مسار CLI" : "Masar CLI"; });
  Masar.init(D);
  play();
})();
</script>
</body>
</html>
