<title>Masar Setup</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="app.css">
<style>
body { height: 100vh; height: 100svh; display: flex; flex-direction: column; background: radial-gradient(60% 50% at 50% 0%, rgba(23, 107, 100, 0.22), transparent 70%), var(--bg); }
.bg-roads { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg-roads path { fill: none; stroke: var(--teal-hi); stroke-width: 1; opacity: 0.16; vector-effect: non-scaling-stroke; }
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px; padding-left: var(--gl); padding-right: var(--gr); }
.top .end { display: flex; gap: 8px; align-items: center; }
.skip { color: var(--muted); font-size: 14px; text-decoration: none; padding: 8px; }
.skip:hover { color: var(--fg); }
.prog { position: relative; z-index: 2; display: flex; gap: 6px; justify-content: center; padding-left: var(--gl); padding-right: var(--gr); }
.prog i { width: 34px; height: 4px; border-radius: 4px; background: var(--line); transition: background 0.4s; }
.prog i.on { background: var(--mint); }
.stagebox { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; }
.step { grid-area: 1 / 1; align-self: stretch; justify-self: center; display: flex; flex-direction: column; justify-content: safe center; overflow-y: auto; overscroll-behavior: contain; width: min(640px, 100%); padding-block: 28px 40px; padding-left: var(--gl); padding-right: var(--gr); opacity: 0; transform: translateX(40px); pointer-events: none; transition: opacity 0.45s, transform 0.55s cubic-bezier(0.65, 0, 0.35, 1); visibility: hidden; }
html[dir="rtl"] .step { transform: translateX(-40px); }
.step.past { transform: translateX(-40px); }
html[dir="rtl"] .step.past { transform: translateX(40px); }
html .step.on, html[dir] .step.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
.step h1 { margin: 6px 0 10px; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.25; text-wrap: balance; }
html[lang="en"] .step h1 { line-height: 1.1; letter-spacing: -0.03em; }
.step > p { margin: 0 0 24px; color: var(--muted); font-size: 16.5px; max-width: 48ch; }
.hello { text-align: center; }
.hello > p { margin-inline: auto; }
.hello .logo { width: 108px; height: 108px; margin: 0 auto 22px; }
.hello .logo svg { width: 100%; height: 100%; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 30px rgba(114, 183, 167, 0.2)); }
.hello .logo .stroke { stroke-dasharray: 150; stroke-dashoffset: 150; }
.hello.on .logo .stroke { animation: draw 1.3s 0.2s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
.hello .logo .dot { transform-box: fill-box; transform-origin: center; transform: scale(0); }
.hello.on .logo .dot { animation: pop 0.5s 1.3s cubic-bezier(0.34, 1.8, 0.64, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { to { transform: scale(1); } }
.group { margin-top: 18px; }
.group h3 { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
.goal-grid { display: grid; gap: 18px; }
.goal-row { padding: 16px; display: grid; gap: 10px; }
.goal-row .gr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.goal-row b.val { font: 700 24px/1 var(--font-en); color: var(--mint); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.conns { display: grid; gap: 10px; }
.conn { display: flex; align-items: center; gap: 12px; padding: 14px; }
.conn .ci { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 800 13px/1 var(--font-en); color: #fff; }
.conn .ct { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.conn .ct small { color: var(--muted); font-size: 12.5px; }
.dl { display: grid; gap: 10px; }
.dl-opt { display: flex; align-items: center; gap: 12px; padding: 14px; }
.dl-opt.mine { border-color: var(--mint); }
a.dl-opt { color: inherit; text-decoration: none; }
.dl-opt .oi { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); flex: none; }
.dl-opt .oi svg { width: 22px; height: 22px; }
.dl-opt .ot { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dl-opt .ot small { color: var(--muted); font-size: 12.5px; }
.soon-tag { flex: none; padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: rgba(216, 166, 87, 0.14); color: #d8a657; }
.dl-note { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(114, 183, 167, 0.08); color: #cfe0dc; font-size: 14px; }
.dl-note ol { margin: 6px 0 0; padding-inline-start: 20px; }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; }
.actions .btn.mint { min-width: 140px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } .actions .btn.mint { flex: 1; } }
@media (prefers-reduced-motion: reduce) { .step { transition: none; } .hello.on .logo .stroke, .hello.on .logo .dot { animation-duration: 0.01s; animation-delay: 0s; } }
</style>

<main class="stagebox">
  <!-- 1 -->
  <section class="step hello" data-step>
    <div class="logo"><svg viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#101A1B"/><rect x=".75" y=".75" width="94.5" height="94.5" rx="19.25" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/><path class="stroke" d="M25 67V34c0-5 4-9 9-9h10c5 0 9 4 9 9v12c0 5 4 9 9 9h9" fill="none" stroke="#FAF8F3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="74" cy="55" r="7" fill="#72B7A7"/></svg></div>

    <h1 data-t="h1"></h1>
    <p data-t="p1"></p>
  </section>
  <!-- 2 -->
  <section class="step" data-step>
    <span class="eyebrow" data-t="e2"></span>
    <h1 data-t="h2"></h1>
    <p data-t="p2"></p>
    <div class="chips" id="industries"></div>
    <div class="field" style="margin-top:18px"><label for="ideal" data-t="idealL"></label><textarea class="input" id="ideal" data-ph="idealPh"></textarea></div>
  </section>
  <!-- 3 -->
  <section class="step" data-step>
    <span class="eyebrow" data-t="e3"></span>
    <h1 data-t="h3"></h1>
    <p data-t="p3"></p>
    <div id="cities"></div>
  </section>
  <!-- 4 -->

    <span class="eyebrow" data-t="e4"></span>

    <p data-t="p4"></p>
    <div class="goal-grid">

      <div class="card goal-row"><div class="gr-top"><label for="gMeet" data-t="gMeet"></label><b class="val" id="gMeetV"></b></div><input type="range" id="gMeet" min="1" max="40" step="1" value="8"></div>

      </div>
    </div>
  </section>
  <!-- 5 -->
  <section class="step" data-step>
    <span class="eyebrow" data-t="e5"></span>
    <h1 data-t="h5"></h1>
    <p data-t="p5"></p>
    <div class="conns" id="conns"></div>
  </section>
  <!-- 6 -->
  <section class="step" data-step>
    <span class="eyebrow" data-t="e6"></span>
    <h1 data-t="h6"></h1>
    <p data-t="p6"></p>
    <div class="dl" id="dl"></div>
    <div id="dlMore"></div>
  </section>
</main>
<div class="actions" style="position:relative;z-index:2;width:min(640px,100%);margin:0 auto;padding-block:0 calc(28px + env(safe-area-inset-bottom,0px));padding-left:var(--gl);padding-right:var(--gr)">
  <button class="btn" type="button" id="back" data-t="back"></button>
  <button class="btn mint" type="button" id="next"></button>
</div>

  function render() {
    const d = D[M.lang];
    $("#industries").innerHTML = d.ind.map((x, i) => '<button type="button" class="pick" data-i="' + i + '" aria-pressed="' + setup.ind.includes(i) + '">' + x + "</button>").join("");
    $$("#industries .pick").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.i, on = setup.ind.includes(i);
      setup.ind = on ? setup.ind.filter((x) => x !== i) : setup.ind.concat(i);
      b.setAttribute("aria-pressed", !on);
    }));
    $("#cities").innerHTML = d.countries.map((c, ci) => '<div class="group"><h3>' + c[0] + '</h3><div class="chips">' + c[1].map((x, i) => '<button type="button" class="pick" data-k="' + ci + "-" + i + '" aria-pressed="' + setup.cities.includes(ci + "-" + i) + '">' + x + "</button>").join("") + "</div></div>").join("");
    $$("#cities .pick").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.k, on = setup.cities.includes(k);
      setup.cities = on ? setup.cities.filter((x) => x !== k) : setup.cities.concat(k);
      b.setAttribute("aria-pressed", !on);
    }));
    $("#conns").innerHTML = d.conns.map((c, i) => '<div class="card conn"><span class="ci" style="background:' + c[2] + '">' + c[3] + '</span><span class="ct"><b>' + c[0] + "</b><small>" + c[1] + '</small></span><button type="button" class="btn sm ' + (setup.conns.includes(i) ? "mint" : "") + '" data-c="' + i + '">' + (setup.conns.includes(i) ? d.connected : d.connect) + "</button></div>").join("");
    $$("#conns [data-c]").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.c, on = setup.conns.includes(i);
      setup.conns = on ? setup.conns.filter((x) => x !== i) : setup.conns.concat(i);
      b.classList.toggle("mint", !on); b.textContent = !on ? d.connected : d.connect;
    }));
    // The CLI links to its install page; the apps are not out yet and show a "coming soon" tag
    const order = ["iph", "and"].includes(myOS) ? ["cli", "iph", "and", "mac", "win", "lin"] : ["cli", "mac", "win", "lin", "iph", "and"];
    $("#dl").innerHTML = order.map((k) => k === "cli"
      ? '<a class="card dl-opt mine" href="/cli" target="_blank" rel="noopener"><span class="oi">' + OSI[k] + '</span><span class="ot"><b>' + d.os[k][0] + "</b><small>" + d.os[k][1] + '</small></span><span class="btn sm mint">' + d.installTag + "</span></a>"
      : '<div class="card dl-opt"><span class="oi">' + OSI[k] + '</span><span class="ot"><b>' + d.os[k][0] + "</b><small>" + d.os[k][1] + '</small></span><span class="soon-tag">' + d.soonTag + "</span></div>").join("");
    $("#gLeads").value = setup.leads; $("#gMeet").value = setup.meet; $("#gDeal").value = setup.deal; $("#gCur").value = setup.cur; $("#ideal").value = setup.ideal;
    sync();
    go(cur, true);
  }
  function sync() {
    $("#gLeadsV").textContent = $("#gLeads").value;
    $("#gMeetV").textContent = $("#gMeet").value;
  }
  ["gLeads", "gMeet"].forEach((id) => $("#" + id).addEventListener("input", sync));

  function go(i, quiet) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    steps.forEach((s, k) => { s.classList.toggle("on", k === cur); s.classList.toggle("past", k < cur); s.setAttribute("aria-hidden", k !== cur); });
    $$(".prog i").forEach((b, k) => b.classList.toggle("on", k <= cur));
    const d = D[M.lang];
    $("#back").style.visibility = cur ? "visible" : "hidden";
    $("#next").textContent = cur === 0 ? d.start : cur === steps.length - 1 ? d.finish : d.next;
    if (!quiet) { const h = steps[cur].querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
  }
  $("#back").addEventListener("click", () => go(cur - 1));
  $("#next").addEventListener("click", async () => {
    read();
    if (cur === steps.length - 1) {
      $("#next").disabled = true;
      try { await persist(true); M.toast(D[M.lang].saved); setTimeout(() => { location.href = "/dashboard"; }, 600); }
      catch (e) { $("#next").disabled = false; failed(e); }
      return;
    }
    if (cur > 0) persist(false).catch(() => {});
    go(cur + 1);
  });
  // Skipping still saves what was picked so far and marks the tour as seen
  $("#skip").addEventListener("click", (e) => { e.preventDefault(); persist(true).then(() => { location.href = "/dashboard"; }, failed); });

  M.onLang(render);
  M.init(D);
})();
</script>
</body>
</html>
